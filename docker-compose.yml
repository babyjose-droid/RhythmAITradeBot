# Local development stack. Copy .env.example to .env first (placeholders only).
# Ports are published on 127.0.0.1 only: there is no dashboard authentication until Phase 8.
name: rhythm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rhythm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rhythm}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Host port defaults to 55432 to avoid clashing with a local PostgreSQL on 5432.
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      RHYTHM_ENVIRONMENT: ${RHYTHM_ENVIRONMENT:-local}
      RHYTHM_TRADING_MODE: ${RHYTHM_TRADING_MODE:-RESEARCH_ONLY}
      RHYTHM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rhythm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rhythm}
      RHYTHM_LOG_LEVEL: ${RHYTHM_LOG_LEVEL:-INFO}
      RHYTHM_LOG_JSON: ${RHYTHM_LOG_JSON:-true}
      RHYTHM_MARKET_DATA_PROVIDER: ${RHYTHM_MARKET_DATA_PROVIDER:-none}
      RHYTHM_BROKER_ADAPTER: ${RHYTHM_BROKER_ADAPTER:-none}
      RHYTHM_EVENT_PROVIDER: ${RHYTHM_EVENT_PROVIDER:-none}
      RHYTHM_FUNDAMENTALS_PROVIDER: ${RHYTHM_FUNDAMENTALS_PROVIDER:-none}
      RHYTHM_FEATURES__PAPER_TRADING: ${RHYTHM_FEATURES__PAPER_TRADING:-false}
      RHYTHM_FEATURES__RESEARCH_SERVICE: ${RHYTHM_FEATURES__RESEARCH_SERVICE:-false}
      RHYTHM_RESEARCH_PROVIDER: ${RHYTHM_RESEARCH_PROVIDER:-none}
      RHYTHM_RESEARCH__MODEL: ${RHYTHM_RESEARCH__MODEL:-}
      RHYTHM_RESEARCH__API_KEY: ${RHYTHM_RESEARCH__API_KEY:-}
      RHYTHM_RESEARCH__GATE_PAPER_ENTRIES: ${RHYTHM_RESEARCH__GATE_PAPER_ENTRIES:-false}
      RHYTHM_RESEARCH__DAILY_TOKEN_BUDGET: ${RHYTHM_RESEARCH__DAILY_TOKEN_BUDGET:-200000}
      RHYTHM_AUTH__ENABLED: ${RHYTHM_AUTH__ENABLED:-true}
      RHYTHM_AUTH__SECRET_KEY: ${RHYTHM_AUTH__SECRET_KEY:-}
      RHYTHM_NOTIFICATIONS__WEBHOOK_URL: ${RHYTHM_NOTIFICATIONS__WEBHOOK_URL:-}
      RHYTHM_NOTIFICATIONS__WEBHOOK_MIN_SEVERITY: ${RHYTHM_NOTIFICATIONS__WEBHOOK_MIN_SEVERITY:-warning}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-env
    ports:
      # Override with API_HOST_PORT if 8000 is taken on your machine.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Next.js bakes rewrites in at build time; the API is reached on the compose network.
        RHYTHM_API_URL: http://api:8000
    # Published on 127.0.0.1 only (no dashboard authentication until Phase 8).
    ports:
      # Host port defaults to 3300 so it does not collide with other dev apps on 3000.
      - "127.0.0.1:${WEB_HOST_PORT:-3300}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
