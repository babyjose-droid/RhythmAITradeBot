name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhythm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rhythm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhythm -d rhythm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rhythm:ci-only-password@localhost:5432/rhythm_test
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types (mypy --strict)
        run: mypy
      - name: Import contracts
        run: lint-imports
      - name: Tests (unit + integration)
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Dependency audit
        run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rhythm-ai-trader:ci .
      - name: Refuses LIVE mode
        run: |
          set +e
          docker run --rm -e RHYTHM_DATABASE_URL=postgresql+psycopg://u:p@127.0.0.1:1/x \
            -e RHYTHM_TRADING_MODE=LIVE rhythm-ai-trader:ci
          code=$?
          test "$code" -ne 0
