# Alembic CLI config. The database URL is read from RHYTHM_DATABASE_URL (see env.py);
# never put credentials in this file.
[alembic]
script_location = rhythm.db:migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
